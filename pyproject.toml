[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.27.0"]

[project]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "meridian-storage-core==1.3.0",
    "meridian-storage-semantics==2.2.0",
]
description = "Provider-neutral Meridian Object Catalog contracts, streaming utilities, and conformance"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
]
name = "meridian-storage-object-common"
readme = "README.md"
requires-python = ">=3.12"
version = "1.0.3"

[[project.authors]]
name = "Meridian contributors"

[project.entry-points."meridian_storage.catalogs"]
object = "meridian_storage.object_common.catalog:ObjectCatalogProvider"

[project.optional-dependencies]
test = [
    "build>=1.2,<2",
    "hatchling==1.27.0",
    "hypothesis>=6.135,<7",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianObjectCommon#readme"
Issues = "https://github.com/zephytiju/MeridianObjectCommon/issues"
Repository = "https://github.com/zephytiju/MeridianObjectCommon"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["meridian_storage.object_common"]

[tool.hatch.build]
include = [
    "src/meridian_storage/object_common/**",
    "contracts/**",
    "docs/**",
    "scripts/**",
    "tests/**",
    ".github/**",
    "compatibility.json",
    "requirements-validation.txt",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
    "README.md",
    "RELEASING.md",
    "SECURITY.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/contracts",
    "/docs",
    "/scripts",
    "/.github",
    "/compatibility.json",
    "/requirements-validation.txt",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/RELEASING.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.wheel.force-include]
"compatibility.json" = "meridian_storage/object_common/compatibility.json"
contracts = "meridian_storage/object_common/contracts/data"

[tool.jumbo]
lock_sources = [
    "meridian-storage-core",
    "meridian-storage-semantics",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"
namespace_packages = true
packages = ["meridian_storage.object_common"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "contract: serialized public contract tests",
    "conformance: provider-neutral adapter conformance",
    "integration: released Core and Semantics integration",
    "packaging: built artifact verification",
    "property: generative deterministic contract tests",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.uv.sources.meridian-storage-core]
path = "deps/meridian-storage-core"

[tool.uv.sources.meridian-storage-semantics]
path = "deps/meridian-storage-semantics"
